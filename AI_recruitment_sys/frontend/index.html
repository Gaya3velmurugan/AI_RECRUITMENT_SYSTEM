<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TalentDesk</title>
<style>

.nav{padding:12px 10px}.nav small{display:block;color:#94a3b8;font-size:.75rem;margin:4px 10px 8px}
.nav button{display:flex;gap:12px;width:100%;align-items:center;background:none;border:0;color:inherit;padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:2px;text-align:left}
.nav button:hover{background:#2b3a52}.nav button[aria-current=page]{background:var(--p2);color:#fff}
svg{fill:currentColor}.nav svg,.ic svg{width:18px;height:18px}
.fine{font-size:.78rem;color:#94a3b8;margin:auto 14px 10px}.rs{margin:0 14px;background:none;border:1px solid #475569;color:#cbd5e1;border-radius:6px;padding:6px;cursor:pointer}
.mc{min-width:0}.top{height:56px;background:#fff;border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:5}
.crumb{color:var(--mut);white-space:nowrap}.crumb b{color:var(--ink)}

.ib{background:none;border:0;cursor:pointer;color:var(--mut);padding:6px;border-radius:6px}.ib:hover{background:#f3f4f6}.ib svg{width:20px;height:20px;display:block}
.me{display:flex;align-items:center;gap:8px;white-space:nowrap}.me em{font-style:normal}

.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.ph h2{font-size:1.3rem}.ph p{margin:2px 0 0;color:var(--mut)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.k,.box{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:16px 18px}
.k{display:flex;gap:14px;align-items:center;cursor:pointer}.k:hover{border-color:#b8cdf5}.k b{display:block;font-size:1.6rem;line-height:1.1;font-weight:600}.k div span{color:var(--mut);font-size:.85rem}

.tw{background:#fff;border:1px solid var(--ln);border-radius:8px;overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;min-width:780px}.box .tbl{min-width:0}

.row{display:flex;gap:10px;align-items:center;justify-content:space-between}

.star{background:none;border:0;font-size:1.25rem;cursor:pointer;color:#c3cad4}.star.on{color:var(--amb)}
.tg{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 0;padding:0;list-style:none}.tg li{background:#eef1f6;border-radius:4px;padding:1px 8px;font-size:.8rem}.tg li.hit{background:#dcf3e4;color:#15603a;font-weight:600}
.kb{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#e9edf3;border-radius:8px;padding:10px;min-height:280px}.col.over{outline:2px dashed var(--p2)}.col h3{font-size:.92rem;display:flex;justify-content:space-between;margin:2px 4px 10px}
.kc{background:#fff;border:1px solid var(--ln);border-radius:6px;padding:10px;margin-bottom:8px;cursor:grab}
.sh{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:19}
.dw{position:fixed;inset:0 0 0 auto;width:min(450px,100%);background:#fff;padding:22px;overflow:auto;z-index:20;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.dw h3{margin:16px 0 6px;font-size:.95rem}.x{background:none;border:0;font-size:1.6rem;cursor:pointer;line-height:1}
.ts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 18px;border-radius:6px;z-index:30}
.jl{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}@media(max-width:1000px){.jl{grid-template-columns:1fr}}
.rk{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--p2);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.rn{width:28px;height:28px;border-radius:50%;background:var(--p2);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.sc{text-align:right}.sc b{display:block;font-size:1.4rem;line-height:1;color:var(--ok)}.sc span{font-size:.75rem;color:var(--mut)}
.why{list-style:none;margin:8px 0 0;padding:0;font-size:.9rem}.why li::before{content:"\2713\00a0";color:var(--ok);font-weight:700}.why li.no::before{content:"\2715\00a0";color:var(--bad)}
.note{padding:10px 12px;border-radius:6px;margin-top:12px;font-size:.92rem}.note.info{background:var(--mint)}.note.warn{background:#fef3c7;color:#78510a}.note.bad{background:#fee2e2;color:#8a1f14}
.drop{border:2px dashed #cbd5e1;border-radius:8px;padding:34px 16px;text-align:center;background:#fafbfc;cursor:pointer}.drop.over{border-color:var(--p2);background:var(--mint)}
.sp{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.sp span{padding:3px 12px;border-radius:4px;background:#e8ecf2;font-size:.85rem}.sp .on{background:#fde68a;font-weight:600}.sp .ok{background:var(--p2);color:#fff}.sp .bad{background:var(--bad);color:#fff}

.md{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,94%);max-height:90vh;overflow:auto;background:#fff;border-radius:8px;padding:22px;z-index:21;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.fm{display:grid;gap:12px}.fm label{display:grid;gap:4px;font-weight:600;font-size:.85rem}.fm .in,textarea.in{width:100%}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tl{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--ln)}.tl li{margin:0 0 10px;position:relative}.tl li::before{content:"";position:absolute;left:-23px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--p2))}

.cal button.has::after{content:"";position:absolute;bottom:4px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--p2)}.cal button.sel{background:var(--p2);color:#fff}.cal button.sel::after{background:#fff}.cal button.today{outline:1px solid var(--p2)}
@media print{aside,.top,.ph .btn,.ts{display:none}.app{display:block}main{padding:0}}

</style></head><body>
<div class="app"><aside><div class="brand"><span class="logo">T</span>TalentDesk</div><nav class="nav" id="nav"></nav>
<p class="fine">Resumes you upload are saved on the server. Stages, notes and interviews are saved in this browser.</p><button class="rs" id="reset">Clear dashboard data</button></aside>
<div class="mc"><header class="top"><div class="crumb" id="crumb"></div><div class="sb"><span id="si"></span><input id="gs" type="search" placeholder="Search candidates or skills" aria-label="Search candidates"></div>
<button class="ib" id="bell" type="button" aria-label="Notifications"><span id="bi"></span></button><div class="me"><span class="av" style="width:32px;height:32px;background:#2f6bd8;font-size:.8rem">HR</span><em>HR Admin</em></div></header>
<main id="main"></main></div></div>
<div id="layer"></div><div class="ts" id="ts" hidden></div>
<script>
const $=id=>document.getElementById(id);
function h(t,a,...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a||{}))x==='class'?e.className=v:e.setAttribute(x,v);for(const c of k.flat())if(c!=null)e.append(c.nodeType?c:document.createTextNode(String(c)));return e}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ST=['Applied','Screening','Interview','Offer','Hired','Rejected'],SC={Applied:'#6b7280',Screening:'#2f6bd8',Interview:'#8b5cf6',Offer:'#f59e0b',Hired:'#16a34a',Rejected:'#dc2626'};
const PAL=['#1f5c5c','#7c3aed','#2563eb','#c2410c','#be185d','#0f766e','#4d7c0f','#b45309'];
let uid=Date.now();
const jb=(t,s,x,c)=>({id:++uid,title:t,skills:s.split(',').map(z=>z.trim()).filter(Boolean),exp:x,comm:c,dept:'General',loc:'Remote',type:'Full-time',status:'Open',desc:'',posted:Date.now()});
let S;try{S=JSON.parse(localStorage.getItem('talentdesk')||'null')}catch{}if(!S||!S.c)S={c:[],j:[]};
const WFD={Applied:['Review resume','Check required skills'],Screening:['Phone screen','Verify experience','Check communication'],Interview:['Schedule interview','Share interview kit','Collect feedback'],Offer:['Prepare offer letter','Get salary approval','Send offer'],Hired:['Background check','Send onboarding details'],Rejected:['Send rejection email']};
(function(){const D=864e5,now=Date.now();
 if(!S.v){S.v=2;const gone=new Set(S.c.filter(c=>c.src==='demo').map(c=>c.id)),SJ={'AI Engineer':'Python,LLM,RAG,FAISS','Backend Developer':'Python,FastAPI,Docker,SQL','Frontend Developer':'React,JavaScript,CSS','Data Analyst':'SQL,Python,Power BI'};
 S.c=S.c.filter(c=>c.src!=='demo');if(S.iv)S.iv=S.iv.filter(i=>!gone.has(i.cid));S.j=S.j.filter(j=>SJ[j.title]!==(j.skills||[]).join(','))}
 S.j.forEach(j=>{j.status=j.status||'Open';j.type=j.type||'Full-time';j.desc=j.desc||'';j.posted=j.posted||now-7*D;j.dept=j.dept||'General';j.loc=j.loc||'Remote'});
 S.c.forEach(c=>{c.hist=c.hist||[{s:'Applied',t:now-5*D}].concat(c.stage==='Applied'?[]:[{s:c.stage,t:now-2*D}]);c.notes=c.notes||'';c.done=c.done||{}});
 S.wf=S.wf||JSON.parse(JSON.stringify(WFD));S.wf.Rejected=S.wf.Rejected||WFD.Rejected;S.auto=S.auto||{sched:true,hire:true,nohire:true};

/* small pieces */

  const sel=h('select',{class:'in','aria-label':'Stage'},ST.map(s=>h('option',s===c.stage?{value:s,selected:''}:{value:s},s)));sel.onchange=()=>{setStage(c,sel.value);open(id)};
  const x=h('button',{class:'x',type:'button','aria-label':'Close'},'\u00d7');x.onclick=close;
  const d=h('div',{class:'dw',role:'dialog','aria-label':c.name},
    h('div',{class:'row'},h('div',{class:'row'},av(c,52),h('div',{},h('h2',{style:'font-size:1.25rem'},c.name),h('div',{class:'mut'},c.experience+' yr experience, '+(c.src==='demo'?'sample candidate':'live resume')))),x),
    h('div',{class:'mut',style:'margin-top:10px'},[c.email,c.phone].filter(Boolean).join('   ')),
    h('div',{class:'row',style:'margin-top:12px;justify-content:flex-start'},sel,star(c),h('span',{class:'mut'},'Shortlist')),
    h('h3',{},'Skill scores (AI estimates)'),bar('Coding',c.coding),bar('Communication',c.communication),bar('Problem solving',c.problem_solving),bar('Leadership',c.leadership),

    h('h3',{},'Fit for open positions'),...S.j.map(j=>{const m=match(c,j);return bar(j.title,m.score)}),...more(c,id));
  $('layer').replaceChildren(sh,d)}
document.onkeydown=e=>{if(e.key==='Escape')close()};

$('nav').replaceChildren(h('small',{},'Menu'),...[['dash','Dashboard','dash'],['cands','Candidates','cands'],['pipe','Hiring Pipeline','pipe'],['posts','Job Postings','posts'],['jobs','Match Candidates','srch'],['iv','Interviews','cal'],['rep','Reports','rep'],['wf','Hiring Workflow','wf'],['add','Upload Resume','add']].map(([v,l,i])=>{const b=h('button',{type:'button','data-v':v},ic(i),l);b.onclick=()=>go(v);return b}));
$('si').replaceWith(ic('srch'));$('bi').replaceWith(ic('bell'));$('bell').onclick=()=>toast('No new notifications');
$('gs').onkeydown=e=>{if(e.key==='Enter'){F.q=e.target.value;F.st='';F.skill='';go('cands')}};
$('reset').onclick=()=>{if(confirm('Clear all candidates, job postings and interviews from this browser? Resumes saved on the server are not deleted.')){try{localStorage.removeItem('talentdesk')}catch{}location.reload()}};
render();
</script></body></html>
